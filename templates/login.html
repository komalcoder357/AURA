{% extends "base.html" %}
{% block title %}Log in · AURA{% endblock %}
{% block content %}
<h1>Welcome back</h1>
<p class="muted">Log in to continue your conversations.</p>
<div id="formError" class="form-error" role="alert" {% if not error %}hidden{% endif %}>{{ error or "" }}</div>
<form method="post" action="{{ url_for('auth.login') }}" class="auth-form" id="authForm" data-kind="login" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Email
    <input type="email" name="email" id="email" required autocomplete="email" value="{{ values.get('email', '') }}" aria-describedby="err-email" {% if field_errors.get('email') %}aria-invalid="true"{% endif %}>
    <span class="field-error" id="err-email">{{ field_errors.get('email', '') }}</span>
  </label>
  <label>Password
    <span class="pw-wrap">
      <input type="password" name="password" id="password" required autocomplete="current-password" aria-describedby="err-password" {% if field_errors.get('password') %}aria-invalid="true"{% endif %}>
      {% with target="password" %}{% include "_eye.html" %}{% endwith %}
    </span>
    <span class="field-error" id="err-password">{{ field_errors.get('password', '') }}</span>
  </label>
  <button class="btn primary" type="submit" id="submitBtn">Log in</button>
</form>
<p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/auth.js') }}"></script>{% endblock %}
